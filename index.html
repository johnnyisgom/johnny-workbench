<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johnny 的工作台</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "PingFang SC", sans-serif;
  background: #f6f6f4;
  color: #1d1d1f;
}

.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 48px 22px 60px;
}

.header {
  margin-bottom: 36px;
}

h1 {
  font-size: 36px;
  margin: 0 0 8px;
  letter-spacing: -1px;
}

.subtitle {
  color: #777;
  font-size: 15px;
}

.date {
  margin-top: 20px;
  font-size: 14px;
  color: #999;
}

.section {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,.04);
}

.section h2 {
  margin: 0 0 18px;
  font-size: 18px;
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
  font-size: 16px;
}

.task:last-child {
  border-bottom: none;
}

.task input {
  width: 19px;
  height: 19px;
}

.task.done label {
  color: #aaa;
  text-decoration: line-through;
}

.footer {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin-top: 32px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Johnny 的工作台</h1>
    <div class="subtitle">少一点复杂，专注今天。</div>
    <div class="date" id="date"></div>
  </div>

  <div class="section">
    <h2>今天</h2>

    <div class="task">
      <input type="checkbox" id="task1">
      <label for="task1">今天最重要的一件事</label>
    </div>

    <div class="task">
      <input type="checkbox" id="task2">
      <label for="task2">学习</label>
    </div>

    <div class="task">
      <input type="checkbox" id="task3">
      <label for="task3">健身</label>
    </div>

    <div class="task">
      <input type="checkbox" id="task4">
      <label for="task4">英语</label>
    </div>
  </div>

  <div class="section">
    <h2>学习</h2>

    <div class="task">
      <input type="checkbox" id="study1">
      <label for="study1">英语课程</label>
    </div>

    <div class="task">
      <input type="checkbox" id="study2">
      <label for="study2">英语视频跟读</label>
    </div>

    <div class="task">
      <input type="checkbox" id="study3">
      <label for="study3">复习</label>
    </div>
  </div>

  <div class="section">
    <h2>其他</h2>

    <div class="task">
      <input type="checkbox" id="other1">
      <label for="other1">舞蹈练习</label>
    </div>

    <div class="task">
      <input type="checkbox" id="other2">
      <label for="other2">整理收藏的视频</label>
    </div>
  </div>

  <div class="footer">
    Johnny · Workbench
  </div>

</div>

<script>
const date = new Date();

document.getElementById("date").textContent =
  date.toLocaleDateString("zh-CN", {
    year: "numeric",
    month: "long",
    day: "numeric",
    weekday: "long"
  });

document.querySelectorAll(".task input").forEach(box => {
  box.addEventListener("change", () => {
    box.parentElement.classList.toggle("done", box.checked);
  });
});
</script>

</body>
</html>
