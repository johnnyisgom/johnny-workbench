<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johnny 的工作台</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f5f3;
  color: #1d1d1f;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    sans-serif;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 42px 20px 60px;
}

/* 顶部 */
.header {
  margin-bottom: 30px;
}

h1 {
  margin: 0;
  font-size: 36px;
  letter-spacing: -1.5px;
}

.subtitle {
  margin-top: 8px;
  color: #888;
  font-size: 15px;
}

.date {
  margin-top: 18px;
  color: #aaa;
  font-size: 14px;
}

/* 卡片 */
.section {
  background: white;
  border-radius: 22px;
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: 0 3px 18px rgba(0,0,0,.035);
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}

.section h2 {
  margin: 0;
  font-size: 20px;
}

.tag {
  color: #aaa;
  font-size: 11px;
  letter-spacing: 1px;
}

/* 今天 */
.today {
  padding: 26px;
}

.today h2 {
  font-size: 24px;
}

/* 任务 */
.task {
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 48px;
  border-bottom: 1px solid #eeeeee;
  font-size: 16px;
}

.task:last-child {
  border-bottom: none;
}

.task input {
  appearance: none;
  width: 21px;
  height: 21px;
  border: 2px solid #aaa;
  border-radius: 7px;
  background: white;
  flex-shrink: 0;
}

.task input:checked {
  background: #1d1d1f;
  border-color: #1d1d1f;
  position: relative;
}

.task input:checked::after {
  content: "✓";
  color: white;
  font-size: 13px;
  position: absolute;
  left: 4px;
  top: 0px;
}

.task.done label {
  color: #aaa;
  text-decoration: line-through;
}

/* 两列 */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.grid .section {
  margin-bottom: 0;
}

/* 进度 */
.progress {
  margin-top: 18px;
  height: 5px;
  background: #eeeeee;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #1d1d1f;
  transition: width .3s ease;
}

/* 底部 */
.footer {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin-top: 35px;
}

/* 手机 */
@media (max-width: 600px) {

  .container {
    padding: 38px 16px 50px;
  }

  h1 {
    font-size: 32px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .section {
    border-radius: 20px;
    padding: 21px;
  }

  .today {
    padding: 23px 21px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- 顶部 -->
  <div class="header">

    <h1>Johnny 的工作台</h1>

    <div class="subtitle">
      少一点复杂，专注今天。
    </div>

    <div class="date" id="date"></div>

  </div>


  <!-- 今天 -->
  <section class="section today">

    <div class="section-title">
      <h2>今天</h2>
      <span class="tag">TODAY</span>
    </div>

    <div class="task">
      <input type="checkbox" id="today1">
      <label for="today1">今天最重要的一件事</label>
    </div>

    <div class="task">
      <input type="checkbox" id="today2">
      <label for="today2">健身</label>
    </div>

    <div class="task">
      <input type="checkbox" id="today3">
      <label for="today3">学习英语</label>
    </div>

    <div class="task">
      <input type="checkbox" id="today4">
      <label for="today4">英语视频跟读</label>
    </div>

    <div class="task">
      <input type="checkbox" id="today5">
      <label for="today5">完成今天的学习任务</label>
    </div>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

  </section>


  <!-- 今日计划 -->
  <section class="section">

    <div class="section-title">
      <h2>今日计划</h2>
      <span class="tag">PLAN</span>
    </div>

    <div class="task">
      <input type="checkbox" id="plan1">
      <label for="plan1">英语课程一节课</label>
    </div>

    <div class="task">
      <input type="checkbox" id="plan2">
      <label for="plan2">复习前面的内容</label>
    </div>

    <div class="task">
      <input type="checkbox" id="plan3">
      <label for="plan3">学一小段抖音舞蹈</label>
    </div>

  </section>


  <!-- 学习 -->
  <div class="grid">

    <section class="section">

      <div class="section-title">
        <h2>英语学习</h2>
        <span class="tag">ENGLISH</span>
      </div>

      <div class="task">
        <input type="checkbox" id="english1">
        <label for="english1">英语课程</label>
      </div>

      <div class="task">
        <input type="checkbox" id="english2">
        <label for="english2">英语视频跟读</label>
      </div>

      <div class="task">
        <input type="checkbox" id="english3">
        <label for="english3">复习单词</label>
      </div>

      <div class="task">
        <input type="checkbox" id="english4">
        <label for="english4">练习口语</label>
      </div>

    </section>


    <!-- 抖音 -->
    <section class="section">

      <div class="section-title">
        <h2>抖音收藏</h2>
        <span class="tag">COLLECTION</span>
      </div>

      <div class="task">
        <input type="checkbox" id="video1">
        <label for="video1">消化 1 个收藏</label>
      </div>

      <div class="task">
        <input type="checkbox" id="video2">
        <label for="video2">消化 2 个收藏</label>
      </div>

      <div class="task">
        <input type="checkbox" id="video3">
        <label for="video3">整理学习视频</label>
      </div>

    </section>


    <!-- 健身 -->
    <section class="section">

      <div class="section-title">
        <h2>健身</h2>
        <span class="tag">FITNESS</span>
      </div>

      <div class="task">
        <input type="checkbox" id="fitness1">
        <label for="fitness1">今天训练</label>
      </div>

      <div class="task">
        <input type="checkbox" id="fitness2">
        <label for="fitness2">完成训练</label>
      </div>

      <div class="task">
        <input type="checkbox" id="fitness3">
        <label for="fitness3">拉伸</label>
      </div>

    </section>


    <!-- 舞蹈 -->
    <section class="section">

      <div class="section-title">
        <h2>舞蹈练习</h2>
        <span class="tag">DANCE</span>
      </div>

      <div class="task">
        <input type="checkbox" id="dance1">
        <label for="dance1">学一小段</label>
      </div>

      <div class="task">
        <input type="checkbox" id="dance2">
        <label for="dance2">跟练一次</label>
      </div>

      <div class="task">
        <input type="checkbox" id="dance3">
        <label for="dance3">完整跳一次</label>
      </div>

    </section>


    <!-- 自媒体 -->
    <section class="section">

      <div class="section-title">
        <h2>自媒体</h2>
        <span class="tag">CREATE</span>
      </div>

      <div class="task">
        <input type="checkbox" id="media1">
        <label for="media1">发布一个视频</label>
      </div>

      <div class="task">
        <input type="checkbox" id="media2">
        <label for="media2">准备下一个内容</label>
      </div>

    </section>


    <!-- 网店 -->
    <section class="section">

      <div class="section-title">
        <h2>网店</h2>
        <span class="tag">SHOP</span>
      </div>

      <div class="task">
        <input type="checkbox" id="shop1">
        <label for="shop1">处理店铺任务</label>
      </div>

      <div class="task">
        <input type="checkbox" id="shop2">
        <label for="shop2">发布商品</label>
      </div>

    </section>

  </div>


  <!-- 每周复盘 -->
  <section class="section" style="margin-top:16px">

    <div class="section-title">
      <h2>每周复盘</h2>
      <span class="tag">WEEKLY</span>
    </div>

    <div class="task">
      <input type="checkbox" id="weekly1">
      <label for="weekly1">这周完成了什么？</label>
    </div>

    <div class="task">
      <input type="checkbox" id="weekly2">
      <label for="weekly2">什么地方需要改进？</label>
    </div>

    <div class="task">
      <input type="checkbox" id="weekly3">
      <label for="weekly3">下周最重要的事</label>
    </div>

  </section>


  <div class="footer">
    Johnny · Workbench
  </div>

</div>


<script>

/* 日期 */

const date = new Date();

document.getElementById("date").textContent =
  date.toLocaleDateString("zh-CN", {
    year: "numeric",
    month: "long",
    day: "numeric",
    weekday: "long"
  });


/* 勾选 + 自动保存 */

const boxes =
  document.querySelectorAll(".task input");


boxes.forEach(box => {

  const saved =
    localStorage.getItem("johnny-" + box.id);

  if (saved === "true") {

    box.checked = true;

    box.parentElement.classList.add("done");

  }


  box.addEventListener("change", () => {

    box.parentElement.classList.toggle(
      "done",
      box.checked
    );

    localStorage.setItem(
      "johnny-" + box.id,
      box.checked
    );

    updateProgress();

  });

});


/* 今日完成度 */

function updateProgress() {

  const todayBoxes =
    document.querySelectorAll(
      ".today .task input"
    );

  const done =
    document.querySelectorAll(
      ".today .task input:checked"
    ).length;

  const total =
    todayBoxes.length;

  const percentage =
    total === 0
      ? 0
      : (done / total) * 100;

  document.querySelector(
    ".progress-bar"
  ).style.width =
    percentage + "%";

}

updateProgress();

</script>

</body>
</html>
